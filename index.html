<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aplicação moderna, rápida e intuitiva para gerenciamento de tarefas diárias com persistência local." />
  <title>To-Do List — Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Contêiner Principal da Aplicação -->
  <main class="app-container" role="main">
    
    <!-- Cabeçalho -->
    <header class="app-header">
      <div class="header-title-group">
        <h1>Minhas Tarefas</h1>
        <p class="header-subtitle">Organize suas atividades diárias com facilidade</p>
      </div>
      <button 
        type="button" 
        id="theme-toggle-btn" 
        class="btn-icon" 
        aria-label="Alternar tema" 
        title="Alternar tema"
      >
        <!-- Ícone dinâmico renderizado via JavaScript -->
      </button>
    </header>

    <!-- Formulário de Nova Tarefa -->
    <section class="input-section" aria-label="Adicionar nova tarefa">
      <form id="task-form" class="task-form" autocomplete="off">
        <label for="task-input" class="sr-only" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">Nova tarefa</label>
        <input 
          type="text" 
          id="task-input" 
          class="task-input" 
          placeholder="O que precisa ser feito?" 
          maxlength="250" 
          required 
          aria-required="true"
        />
        <button type="submit" id="add-task-btn" class="btn-primary" aria-label="Adicionar tarefa">
          <span>Adicionar</span>
        </button>
      </form>
    </section>

    <!-- Filtros de Visualização -->
    <nav class="filters-section" aria-label="Filtros de status de tarefas">
      <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">Todas</button>
      <button type="button" class="filter-btn" data-filter="pending" aria-pressed="false">Pendentes</button>
      <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Concluídas</button>
    </nav>

    <!-- Lista Dinâmica de Tarefas -->
    <section class="task-list-container" aria-label="Tarefas cadastradas">
      <ul id="task-list" class="task-list" role="list">
        <!-- Itens ou Empty State injetados via JavaScript -->
      </ul>
    </section>

    <!-- Barra de Rodapé com Contador e Ações -->
    <footer class="app-footer">
      <span id="pending-count" class="pending-count" aria-live="polite">0 tarefas pendentes</span>
      <button 
        type="button" 
        id="clear-completed-btn" 
        class="btn-text-danger" 
        style="display: none;"
        aria-label="Limpar tarefas concluídas"
      >
        Limpar concluídas
      </button>
    </footer>

  </main>

  <!-- Dicas de Navegação e UX -->
  <footer class="app-info-footer">
    <p>💡 Dica: Dê um duplo clique no texto ou clique no lápis para editar.</p>
    <p>Pressione <strong>Enter</strong> para confirmar a edição ou <strong>Esc</strong> para cancelar.</p>
  </footer>

  <!-- Script Modular ES6 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
